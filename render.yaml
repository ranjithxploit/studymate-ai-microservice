services:
  - type: web
    name: studymate-ai-server
    env: python
    region: oregon
    plan: free
    branch: Main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash-exp
      - key: PYTHON_VERSION
        value: 3.11.0
